name: build-and-test

on:
  push:
    branches: [main, hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Needed by the Trivy scan step below to publish results to the repo's
  # Security tab (Code scanning alerts) rather than just CI logs.
  security-events: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docs/HARDENING.md item 1: pin the Ubuntu base by digest, not tag.
      # `ubuntu:25.10` can silently repoint over time; resolving and logging
      # the digest here at least makes every build's actual base image
      # visible and auditable in the run log. The Containerfile accepts it
      # via UBUNTU_DIGEST (empty by default, so local `docker build` without
      # this step still works unpinned).
      - name: Resolve Ubuntu base image digest
        id: base
        run: |
          set -euo pipefail
          INSPECT="$(docker buildx imagetools inspect ubuntu:25.10)"
          DIGEST="$(echo "$INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          if [ -z "$DIGEST" ]; then
            echo "Could not parse a digest from imagetools inspect output:"
            echo "$INSPECT"
            exit 1
          fi
          echo "Resolved ubuntu:25.10 -> $DIGEST"
          echo "digest=@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: meta
        env:
          DOCKER_BUILDKIT: "1"
          GH_TOKEN_FOR_BUILD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Docker image refs must be lowercase; the GitHub owner/repo isn't
          # guaranteed to be (this account is "fredIV").
          REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LOWER}:${{ github.sha }}"
          # Passed as a secret (not a build-arg) so it never lands in image
          # history/cache - used inside the Containerfile only to avoid
          # api.github.com's harsh unauthenticated rate limit.
          docker build -f Containerfile \
            --secret id=gh_token,env=GH_TOKEN_FOR_BUILD \
            --build-arg UBUNTU_DIGEST="${{ steps.base.outputs.digest }}" \
            -t "$IMAGE" -t local/bootc-ubuntu-image:test .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: bootc container lint (explicit, in addition to the in-build check)
        run: docker run --rm local/bootc-ubuntu-image:test bootc container lint

      # docs/HARDENING.md item 2: a vulnerability gate before anything gets
      # pushed. CRITICAL/HIGH findings fail the build outright; results are
      # also uploaded as SARIF so they show up under the repo's Security tab
      # instead of only living in this job's logs.
      #
      # Deliberately NOT using the aquasecurity/trivy-action wrapper here:
      # on 2026-03-19 that exact Action had 75 of its 76 version tags
      # force-pushed with malicious code that stole CI secrets while scans
      # kept appearing to succeed (aquasecurity/trivy advisory
      # GHSA-69fq-xp46-6x23) - a live demonstration of the same "mutable
      # tag vs. fixed artifact" problem item 1 above exists to fix, just in
      # a CI dependency instead of the base image. Running Trivy's own
      # container image directly, pinned to a digest resolved the same way
      # the Ubuntu base is, removes that Action from the trust chain
      # entirely rather than just picking a tag of it presumed safe.
      - name: Resolve Trivy image digest
        id: trivy
        run: |
          set -euo pipefail
          INSPECT="$(docker buildx imagetools inspect aquasec/trivy:latest)"
          DIGEST="$(echo "$INSPECT" | awk '/^Digest:/ {print $2; exit}')"
          if [ -z "$DIGEST" ]; then
            echo "Could not parse a digest from imagetools inspect output:"
            echo "$INSPECT"
            exit 1
          fi
          echo "Resolved aquasec/trivy:latest -> $DIGEST"
          echo "image=aquasec/trivy@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Export built image for scanning
        run: docker save local/bootc-ubuntu-image:test -o image.tar

      - name: Scan image for known vulnerabilities (Trivy)
        run: |
          docker run --rm -v "$PWD:/work" "${{ steps.trivy.outputs.image }}" \
            image --input /work/image.tar --severity CRITICAL,HIGH --exit-code 1 --format table

      - name: Scan image for known vulnerabilities (Trivy, SARIF for code scanning)
        if: always()
        run: |
          docker run --rm -v "$PWD:/work" "${{ steps.trivy.outputs.image }}" \
            image --input /work/image.tar --severity CRITICAL,HIGH --exit-code 0 \
            --format sarif --output /work/trivy-results.sarif

      - name: Upload Trivy results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"

  boot-test:
    needs: build-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf podman skopeo

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # bootc-image-builder (a Fedora-authored osbuild wrapper, now
      # deprecated upstream in favor of a unified image-builder tool) got
      # our image past every content-related check - lint, kernel/initrd
      # layout, distro/rootfs detection, SELinux relabeling - but then hit
      # "sfdisk: No such file or directory" deep in its own disk-assembly
      # pipeline. That's a tooling/environment gap in bootc-image-builder
      # itself (it dispatches some stages via a mounted docker.sock to
      # sibling containers we don't control), not anything about our
      # image, and would plausibly hit the same wall on a Fedora image
      # too. So: test bootc's own native `install to-disk` instead - the
      # actual core functionality this whole project is about, with no
      # osbuild/Fedora-tooling layer in between at all.
      #
      # Must run via podman specifically, not plain docker: bootc's
      # install command determines what image it's installing by
      # inspecting its own container runtime (podman sets this up;
      # docker doesn't), otherwise it errors with "Either
      # --source-imgref must be defined or this command must be
      # executed inside a podman container" - found by running it, not
      # guessed.
      #
      # --composefs-backend: bootc auto-detects our image's bootloader as
      # `Bootloader::Systemd` (Ubuntu ships systemd-boot, not a BLS-patched
      # grub2). bootc's classic ostree-backend install path
      # (crates/lib/src/install.rs) only has a real bootloader-install
      # implementation for Grub (`install_via_bootupd`); the
      # Bootloader::Systemd arm is an unconditional
      # `bail!("bootupd is required for ostree-based installs")` with no
      # actual bootupd attempt behind it. The working systemd-boot
      # installer (`install_systemd_boot`, using `bootctl install`
      # directly - no bootupd at all) exists in the same bootloader.rs but
      # is only ever called from bootc's separate composefs-native install
      # backend (crates/lib/src/bootc_composefs/boot.rs), which replaces
      # the ostree-classic sysroot/deployment model entirely and is gated
      # behind this flag. (This is unrelated to the prepare-root.conf
      # `[composefs] enabled` setting in the image, which only toggles the
      # *classic* ostree backend's own internal object storage and doesn't
      # affect which install backend runs at all - confirmed by reading
      # both code paths, not guessed.) --allow-missing-verity: the
      # composefs-native backend hard-requires fs-verity-capable storage
      # unless told otherwise; our loopback-partitioned ext4/fat32 target
      # isn't guaranteed to have it enabled.
      # GHCR image pushed by `docker push` is Docker v2 schema-2, not OCI.
      # bootc's composefs-native backend has an open, unresolved upstream
      # bug (bootc-dev/bootc#1703) that hits exactly this combination:
      # pulling a Docker-schema image from a registry causes it to look up
      # a layer blob under the wrong digest and fail with
      # "GetBlob: ... file does not exist" - found by searching bootc's own
      # issue tracker for the exact error text after hitting it here,
      # confirming it's a known bootc bug rather than anything specific to
      # this image or Ubuntu. The issue's own title calls out the Docker
      # v2s2 trigger, so this rewrites the already-pulled image's stored
      # manifest to OCI format in place (no re-fetch needed - same blobs,
      # same digests, just OCI-typed metadata) before bootc ever touches
      # it, rather than accepting the bug as a hard wall untested.
      - name: Install the bootc image directly to a disk with `bootc install to-disk`
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="${{ needs.build-and-lint.outputs.image }}"
          sudo podman pull "$IMAGE"
          sudo skopeo copy --format oci "containers-storage:$IMAGE" "containers-storage:${IMAGE}-oci"
          truncate -s 10G disk.raw
          LOOPDEV="$(sudo losetup --show -fP disk.raw)"
          echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"
          sudo podman run --rm --privileged --pid=host \
            -v /dev:/dev \
            "${IMAGE}-oci" \
            bootc install to-disk --wipe --composefs-backend --allow-missing-verity "$LOOPDEV"

      # The exact OVMF firmware filenames/paths have moved around across
      # Ubuntu ovmf package versions (plain OVMF_CODE.fd/OVMF_VARS.fd vs.
      # 4M-suffixed variants, and the two guesses tried here so far both
      # missed on this runner's actual package layout). Rather than guess
      # a third filename from changelog text, search broadly with `find`
      # and print exactly what's under /usr/share if nothing matches, so
      # a failure here is self-diagnosing instead of another blind retry.
      - name: Boot the installed disk in QEMU and check it comes up
        run: |
          set -euo pipefail
          sudo losetup -d "$LOOPDEV" || true
          OVMF_CODE="$(find /usr/share -iname 'OVMF_CODE*.fd' ! -iname '*.ms.fd' 2>/dev/null | sort | head -1)"
          OVMF_VARS_SRC="$(find /usr/share -iname 'OVMF_VARS*.fd' ! -iname '*.ms.fd' 2>/dev/null | sort | head -1)"
          if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS_SRC" ]; then
            echo "Could not locate OVMF firmware under /usr/share. Related files found:"
            find /usr/share -iname '*ovmf*' -o -iname '*edk2*' 2>/dev/null
            exit 1
          fi
          echo "Using OVMF_CODE=$OVMF_CODE OVMF_VARS_SRC=$OVMF_VARS_SRC"
          cp "$OVMF_VARS_SRC" ovmf_vars.fd
          timeout 300 qemu-system-x86_64 \
            -m 2048 -smp 2 \
            -enable-kvm -cpu host \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=ovmf_vars.fd \
            -drive file=disk.raw,if=virtio,format=raw \
            -nographic -serial mon:stdio \
            -display none \
            | tee boot.log &
          QEMU_PID=$!

          # Wait for evidence of a working boot on the serial console rather
          # than a fixed sleep. Ubuntu's default getty prompt is a
          # reasonable "the system came up" signal for this first pass.
          for i in $(seq 1 60); do
            if grep -qE 'login:|Welcome to Ubuntu' boot.log 2>/dev/null; then
              echo "Boot succeeded"
              kill $QEMU_PID || true
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for a successful boot; serial log follows:"
          cat boot.log || true
          kill $QEMU_PID || true
          exit 1

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-log
          path: boot.log
