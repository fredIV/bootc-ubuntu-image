name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: meta
        env:
          DOCKER_BUILDKIT: "1"
          GH_TOKEN_FOR_BUILD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Docker image refs must be lowercase; the GitHub owner/repo isn't
          # guaranteed to be (this account is "fredIV").
          REPO_LOWER="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${REPO_LOWER}:${{ github.sha }}"
          # Passed as a secret (not a build-arg) so it never lands in image
          # history/cache - used inside the Containerfile only to avoid
          # api.github.com's harsh unauthenticated rate limit.
          docker build -f Containerfile \
            --secret id=gh_token,env=GH_TOKEN_FOR_BUILD \
            -t "$IMAGE" -t local/bootc-ubuntu-image:test .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: bootc container lint (explicit, in addition to the in-build check)
        run: docker run --rm local/bootc-ubuntu-image:test bootc container lint

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}"

  boot-test:
    needs: build-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and podman
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf podman

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # bootc-image-builder (a Fedora-authored osbuild wrapper, now
      # deprecated upstream in favor of a unified image-builder tool) got
      # our image past every content-related check - lint, kernel/initrd
      # layout, distro/rootfs detection, SELinux relabeling - but then hit
      # "sfdisk: No such file or directory" deep in its own disk-assembly
      # pipeline. That's a tooling/environment gap in bootc-image-builder
      # itself (it dispatches some stages via a mounted docker.sock to
      # sibling containers we don't control), not anything about our
      # image, and would plausibly hit the same wall on a Fedora image
      # too. So: test bootc's own native `install to-disk` instead - the
      # actual core functionality this whole project is about, with no
      # osbuild/Fedora-tooling layer in between at all.
      #
      # Must run via podman specifically, not plain docker: bootc's
      # install command determines what image it's installing by
      # inspecting its own container runtime (podman sets this up;
      # docker doesn't), otherwise it errors with "Either
      # --source-imgref must be defined or this command must be
      # executed inside a podman container" - found by running it, not
      # guessed.
      - name: Install the bootc image directly to a disk with `bootc install to-disk`
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          truncate -s 10G disk.raw
          LOOPDEV="$(sudo losetup --show -fP disk.raw)"
          echo "LOOPDEV=$LOOPDEV" >> "$GITHUB_ENV"
          sudo podman run --rm --privileged --pid=host \
            -v /dev:/dev \
            "${{ needs.build-and-lint.outputs.image }}" \
            bootc install to-disk --wipe "$LOOPDEV"

      - name: Boot the installed disk in QEMU and check it comes up
        run: |
          set -euo pipefail
          sudo losetup -d "$LOOPDEV" || true
          cp /usr/share/OVMF/OVMF_VARS.fd ovmf_vars.fd
          timeout 300 qemu-system-x86_64 \
            -m 2048 -smp 2 \
            -enable-kvm -cpu host \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
            -drive if=pflash,format=raw,file=ovmf_vars.fd \
            -drive file=disk.raw,if=virtio,format=raw \
            -nographic -serial mon:stdio \
            -display none \
            | tee boot.log &
          QEMU_PID=$!

          # Wait for evidence of a working boot on the serial console rather
          # than a fixed sleep. Ubuntu's default getty prompt is a
          # reasonable "the system came up" signal for this first pass.
          for i in $(seq 1 60); do
            if grep -qE 'login:|Welcome to Ubuntu' boot.log 2>/dev/null; then
              echo "Boot succeeded"
              kill $QEMU_PID || true
              exit 0
            fi
            sleep 5
          done

          echo "Timed out waiting for a successful boot; serial log follows:"
          cat boot.log || true
          kill $QEMU_PID || true
          exit 1

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-log
          path: boot.log
